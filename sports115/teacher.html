<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>教師紀錄｜高一體育班數學練習</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script defer src="teacher.js"></script></head><body class="teacher"><header class="topbar"><div class="brand"><span class="brand-mark">數</span><div><p>丹鳳高中・高一體育班</p><h1>教師作答紀錄</h1></div></div><a href="index.html">回練習網站</a></header><main><section class="intro"><div><p class="eyebrow">完成狀況與題型補強</p><h2>從作答，看見需要幫忙的地方。</h2><p>查看每位學生的首次、最佳與最近成績，以及全班常錯題型。</p></div></section><section id="loginPanel" class="panel teacher-login"><h2>教師驗證</h2><p class="muted">在老師本機開啟會自動驗證。其他裝置請使用教師金鑰；金鑰只保留在這個分頁。</p><form id="loginForm"><label>教師金鑰<input type="password" id="teacherKey" autocomplete="off" required></label><button class="primary" type="submit">讀取成績</button></form><p id="loginStatus" role="status" class="muted"></p></section><div id="dashboard" hidden><div class="teacher-tools"><label>練習卷<select id="paperFilter"><option value="">全部練習卷</option></select></label><label>班級<select id="classFilter"><option value="">全部班級</option></select></label><button id="refresh" type="button">重新整理</button><button id="export" type="button">匯出成績 CSV</button></div><div class="teacher-stats" id="stats"></div><section class="panel"><div class="section-head"><h2>學生完成狀況</h2><span class="muted" id="dataTime"></span></div><details class="rules"><summary>檢查哪些座號還沒交卷</summary><p>先選班級及練習卷，再填入應交座號，例如 1-30 或 1,3,5-10。這份名單只保存在老師這台裝置。</p><label>應交座號<input id="rosterInput" placeholder="例如：1-30"></label><p id="missingSeats"></p></details><div class="table-wrap"><table><thead><tr><th>班級</th><th>座號</th><th>姓名</th><th>完成次數</th><th>首次</th><th>最佳</th><th>最近</th><th>最近時間</th></tr></thead><tbody id="studentRows"></tbody></table></div><p id="emptyRecords" class="empty" hidden>目前沒有符合條件的作答紀錄。</p></section><section class="panel" style="margin-top:20px"><div class="section-head"><h2>全班常錯題型</h2><span class="muted">未得滿分次數／作答次數，含部分給分</span></div><div id="typeBars" class="type-bars"></div></section><section class="panel" style="margin-top:20px"><div class="section-head"><h2>最近交卷紀錄</h2><span class="muted">點開可核對逐題作答</span></div><div id="attemptRows"></div></section></div></main></body></html>
